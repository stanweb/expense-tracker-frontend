<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#A855F7"/>
        </linearGradient>
        <linearGradient id="arrowGradient" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
        </linearGradient>
    </defs>

    <rect width="180" height="180" rx="36" fill="url(#bgGradient)"/>

    <g transform="translate(36 38)" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <!-- Wallet body -->
        <rect x="6" y="32" width="96" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.18"/>
        <!-- Wallet flap -->
        <path d="M16 32 V22 a10 10 0 0 1 10 -10 h56 a10 10 0 0 1 10 10 V32"/>
        <!-- Wallet clasp -->
        <circle cx="82" cy="62" r="5" fill="#FFFFFF"/>
        <!-- Chart bars (rising) -->
        <line x1="26" y1="80" x2="26" y2="68" stroke-opacity="0.9"/>
        <line x1="44" y1="80" x2="44" y2="58" stroke-opacity="0.95"/>
        <line x1="62" y1="80" x2="62" y2="48" stroke-opacity="1"/>
    </g>

    <!-- Upward trend arrow -->
    <path
        d="M52 122 L80 96 L98 110 L128 78"
        stroke="url(#arrowGradient)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
    />
    <path
        d="M128 78 L128 92 M128 78 L114 78"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
    />
</svg>