name: Build & Deploy Frontend

on:
  push:
    branches:
      - prod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # FIX: Removed 'driver: docker-container' — the default docker driver
      # correctly resolves named local build stages (e.g. COPY --from=builder)
      # without trying to pull them from Docker Hub.
      # Trade-off: GHA layer cache (type=gha) is not supported with this driver,
      # so cache-from/cache-to are removed. Next.js builds are fast enough
      # that this is acceptable, and Docker's own layer cache still applies.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spending-tracker-frontend:latest
          provenance: false

      - name: Deploy to Homelab Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_TAILSCALE_IP }}
          username: ${{ secrets.HOMELAB_SSH_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          script: |
            cd /opt/stacks/spending-tracker-frontend
            docker compose pull
            docker compose up -d --force-recreate --no-deps frontend
            docker image prune -f